services:
  - type: web
    name: nice-gadgets-backend
    env: node
    rootDir: backend
    buildCommand: npm install --include=dev
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nice-gadgets-db
          property: connectionString

databases:
  - name: nice-gadgets-db
    databaseName: nice_gadgets
    user: postgres
